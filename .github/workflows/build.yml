name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        shell: pwsh
        run: dotnet test tests/WMT.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Test report
        if: always()
        shell: pwsh
        run: ./build/New-TestReport.ps1 -Trx TestResults/results.trx -Out TEST-REPORT.md
      - name: Release (self-contained EXE)
        shell: pwsh
        run: ./build/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WMT-v3.0.0-m1
          path: release/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults
            TEST-REPORT.md
      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v3.0.0-m1'
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create $tag release/*.zip --target "${{ github.sha }}" --title "WMT $tag" --notes "Self-contained Windows x64 build. Unzip, then double-click Launch-WMT.cmd. See README.txt inside. M1 = discovery only (no backup/restore). Built from commit ${{ github.sha }}."
          if ($LASTEXITCODE -ne 0) { throw 'release failed' }
