name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  WMT_VERSION: 4.0.0-beta
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Automated tests (xunit)
        id: tests
        shell: pwsh
        run: dotnet test tests/WMT.Tests -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Build self-contained release
        id: release
        if: always()
        shell: pwsh
        run: ./build/Build-Release.ps1 -Version $env:WMT_VERSION -BuildId "${{ github.run_number }}.${{ github.sha }}"

      - name: GUI self-test (real window, synthetic data)
        id: selftest
        if: always() && steps.release.outcome == 'success'
        shell: pwsh
        run: ./build/Run-SelfTest.ps1 -Exe "release/WMT-$env:WMT_VERSION/WMT.exe" -OutDir "$PWD/selftest-out"

      - name: Test report and evidence
        if: always()
        shell: pwsh
        run: |
          ./build/New-TestReport.ps1 -Trx TestResults/results.trx -Out TEST-REPORT.md -SelfTest selftest-out/selftest.json
          Get-Content TEST-REPORT.md | Select-Object -First 400 | Write-Host
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Copy-Item TEST-REPORT.md evidence/
          if (Test-Path selftest-out/screenshots) { Copy-Item selftest-out/screenshots evidence/ -Recurse }
          if (Test-Path selftest-out/selftest.json) { Copy-Item selftest-out/selftest.json evidence/ }
          if (Test-Path selftest-out/selftest-activity.log) { Copy-Item selftest-out/selftest-activity.log evidence/ }
          Compress-Archive -Path evidence/* -DestinationPath ci-evidence.zip -Force

      - name: Add test report to the release zip
        if: steps.tests.outcome == 'success' && steps.selftest.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item TEST-REPORT.md "release/WMT-$env:WMT_VERSION/TEST-REPORT.md" -Force
          Remove-Item "release/WMT-$env:WMT_VERSION.zip"
          $sums = Get-ChildItem "release/WMT-$env:WMT_VERSION" -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          [IO.File]::WriteAllLines("$PWD/release/WMT-$env:WMT_VERSION/SHA256SUMS.txt", $sums)
          Compress-Archive -Path "release/WMT-$env:WMT_VERSION/*" -DestinationPath "release/WMT-$env:WMT_VERSION.zip"

      - name: Publish CI evidence (every run)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --yes --cleanup-tag 2>$null; $global:LASTEXITCODE = 0
          gh release create ci-latest ci-evidence.zip --prerelease --target "${{ github.sha }}" --title "CI evidence (latest run, not for users)" --notes "Tests: ${{ steps.tests.outcome }}; GUI self-test: ${{ steps.selftest.outcome }}. Commit ${{ github.sha }}."

      - name: Publish user release (only when tests and GUI self-test passed)
        if: steps.tests.outcome == 'success' && steps.selftest.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($t in 'v3.0.0-m1', "v$env:WMT_VERSION") { gh release delete $t --yes --cleanup-tag 2>$null; $global:LASTEXITCODE = 0 }
          gh release create "v$env:WMT_VERSION" "release/WMT-$env:WMT_VERSION.zip" ci-evidence.zip --target "${{ github.sha }}" --title "Workstation Migration Toolkit $env:WMT_VERSION" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'release failed' }
